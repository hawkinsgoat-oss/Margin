<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="champagne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Margin</title>
<meta name="description" content="Make room for what matters.">
<meta name="theme-color" content="#0E1724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Margin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;
 --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 --radius:20px}
html[data-accent="champagne"]{--ac:#C9A45C;--ac2:#E0C182;--acg:rgba(201,164,92,.14)}
html[data-accent="sage"]{--ac:#7FA083;--ac2:#A4C2A8;--acg:rgba(127,160,131,.14)}
html[data-accent="ocean"]{--ac:#5E8FAE;--ac2:#8FB8D2;--acg:rgba(94,143,174,.14)}
html[data-accent="rose"]{--ac:#C08A8A;--ac2:#DCB0B0;--acg:rgba(192,138,138,.14)}
html[data-accent="slate"]{--ac:#8A94A6;--ac2:#B0B9C8;--acg:rgba(138,148,166,.14)}
html[data-accent="terracotta"]{--ac:#C9714B;--ac2:#E19470;--acg:rgba(201,113,75,.15)}
html[data-theme="dark"]{
 --bg:#16171A;--bg2:#1B1D21;--card:#1F2126;--card2:#25282D;--line:#2E3238;--hair:rgba(255,255,255,.055);
 --ink:#E9E7E2;--ink2:#A5A9A6;--ink3:#74797E;
 --ok:#8FAE93;--okg:rgba(143,174,147,.13);--warn:#DE8E6F;--warng:rgba(222,142,111,.12);
 --shadow:0 1px 3px rgba(0,0,0,.28);--shadow-lift:0 6px 20px rgba(0,0,0,.3);--navbg:rgba(18,19,22,.86)}
html[data-theme="navy"]{
 --bg:#0E1724;--bg2:#121D2C;--card:#152234;--card2:#1B2A3E;--line:#25374E;--hair:rgba(255,255,255,.06);
 --ink:#E6EAF0;--ink2:#9FADBF;--ink3:#6C7E93;
 --ok:#7FA9A0;--okg:rgba(127,169,160,.14);--warn:#E1855E;--warng:rgba(225,133,94,.13);
 --shadow:0 1px 3px rgba(0,0,0,.35);--shadow-lift:0 8px 24px rgba(3,10,20,.45);--navbg:rgba(11,19,30,.88)}
html[data-theme="light"]{
 --bg:#FAF9F7;--bg2:#F3F1ED;--card:#FFFFFF;--card2:#F7F6F3;--line:#E6E3DD;--hair:rgba(20,18,14,.07);
 --ink:#33352F;--ink2:#63655F;--ink3:#96988F;
 --ok:#5F7F64;--okg:rgba(95,127,100,.1);--warn:#B0563C;--warng:rgba(176,86,60,.09);
 --shadow:0 1px 2px rgba(50,45,35,.07);--shadow-lift:0 4px 16px rgba(50,45,35,.09);--navbg:rgba(252,251,249,.9)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{max-width:820px;margin:0 auto;padding:14px 18px 104px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none;max-width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
input[type=date],input[type=time]{color-scheme:inherit}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.6}
a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{font-size:12.5px;color:var(--ink3)}
.k{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3);font-weight:700}
.badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.4px}
.badge.ok{background:var(--okg);color:var(--ok)}
.badge.ac{background:var(--acg);color:var(--ac)}
.badge.warn{background:var(--warng);color:var(--warn)}
.btn{font-size:13px;font-weight:700;padding:9px 16px;border-radius:99px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0;min-height:38px;line-height:1.1;max-width:100%}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--ac);color:#fff;border:1px solid var(--ac);box-shadow:none}
.btn:hover{border-color:var(--ink3)}
.btn.pri:hover{filter:brightness(1.08);border-color:var(--ac)}
.btn.soft{background:var(--acg);color:var(--ac);border-color:transparent}
.btn.danger{background:var(--warng);color:var(--warn);border-color:transparent}
.btn.sm{font-size:12px;padding:6px 12px;min-height:30px}
.onb-foot{flex-wrap:wrap}
.onb-foot .btn{flex:0 0 auto}
.iconbtn{width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--ink3);font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:active{transform:scale(.9)}
.meter{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;flex:1;min-width:40px}
.meter>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--ac));transition:width .5s cubic-bezier(.22,1,.36,1)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:8px 14px;border-radius:99px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);min-height:34px;display:inline-flex;align-items:center;white-space:nowrap}
.chip.sel{background:var(--acg);color:var(--ac);border-color:var(--ac)}
.hr{border:none;border-top:1px solid var(--line);margin:12px 0}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 2px 14px}
.top .avatar{width:42px;height:42px;border-radius:99px;border:2px solid var(--ac);background:var(--card2) center/cover;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--ac);flex-shrink:0;overflow:hidden}
.top .tt{flex:1;min-width:0}
.top .tt h1{font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt .sub{font-size:11.5px;color:var(--ink3)}
.marginpill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 14px;text-align:center;box-shadow:var(--shadow)}
.marginpill .mv{font-family:var(--serif);font-size:16px;font-weight:800;color:var(--ac)}
.marginpill .ml{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);font-weight:700}
.tray-btn{position:relative}
.tray-btn .dot{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:99px;background:var(--ac);color:#1A1B1E;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--navbg);backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--hair);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(9px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px;color:var(--ink3);padding:5px 0;border-radius:14px;flex:1;max-width:86px;transition:all .2s}
.nav button .nl{font-size:9.5px;font-weight:700}
.nav button.sel{color:var(--ac);background:var(--acg)}
/* screens */
.screen{display:none;animation:sIn .32s cubic-bezier(.22,1,.36,1)}
.screen.active{display:block}
@keyframes sIn{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.page-head{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.page-head .back{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-head h1{font-size:22px}
.page-head .sub{font-size:11.5px;color:var(--ink3)}
/* timeline */
.tl{position:relative;margin-top:6px}
.tl .hourline{display:flex;gap:10px;min-height:46px;border-top:1px solid var(--line)}
.tl .ht{width:52px;flex-shrink:0;font-size:10.5px;color:var(--ink3);font-weight:700;padding-top:3px;text-align:right}
.tl .hbody{flex:1;padding:3px 0;display:flex;flex-direction:column;gap:4px}
.blk{border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--hair);display:flex;align-items:center;gap:8px;background:var(--card2)}
.blk .bt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font-size:10.5px;color:var(--ink3);font-weight:700;white-space:nowrap}
.blk.ev{border-left:3px solid var(--ac)}
.blk.task{border-left:3px solid var(--ok)}
.blk.task.done{opacity:.55}.blk.task.done .bt{text-decoration:line-through}
.blk.free{background:transparent;border:1px dashed var(--line);color:var(--ink3);justify-content:center;font-weight:600}
/* items */
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 6px;border-bottom:1px solid var(--hair);border-radius:8px;transition:background .14s;margin:0 -6px}
.item:last-child{border:none}
.item:hover{background:var(--card2)}
.check{width:28px;height:28px;border-radius:10px;border:2px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;color:#1A1B1E;font-weight:800;font-size:13px;flex-shrink:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);margin-top:1px}
.item.done .check{background:var(--ac);border-color:var(--ac);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
.item .it{flex:1;min-width:0}
.item .it .t{font-weight:600;font-size:14px;line-height:1.35}
.item.done .it .t{text-decoration:line-through;color:var(--ink3)}
.item .it .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
.pdot{width:8px;height:8px;border-radius:99px;flex-shrink:0;margin-top:8px}
/* board */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.bcol{min-width:220px;flex:1;background:var(--bg2);border-radius:14px;padding:10px}
.bcol h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between}
.bcard{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.bcard .m{font-size:11px;color:var(--ink3);font-weight:500;margin-top:3px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl-wrap{overflow-x:auto}
/* calendar */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{background:var(--card2);border:1px solid var(--hair);border-radius:12px;min-height:92px;padding:6px;font-size:10px}
.cal-day.today{border-color:var(--ac);box-shadow:0 0 10px var(--acg)}
.cal-day .dn{font-family:var(--serif);font-weight:700;font-size:13px}
.cal-day .ev{margin-top:3px;padding:2px 5px;border-radius:6px;background:var(--acg);color:var(--ac);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-day .tk{margin-top:3px;padding:2px 5px;border-radius:6px;background:var(--okg);color:var(--ok);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* widgets/tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;box-shadow:var(--shadow);transition:all .16s;position:relative}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--ink3);box-shadow:var(--shadow-lift)}
.tile .ti{font-size:22px}
.tile .tn{font-family:var(--serif);font-size:15.5px;font-weight:700;margin-top:6px}
.tile .ts{font-size:11px;color:var(--ink3);margin-top:2px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;text-align:center;flex:1;min-width:88px}
.stat .sv{font-family:var(--serif);font-size:19px;font-weight:800;color:var(--ac)}
.stat .sl{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);font-weight:700}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(8,9,10,.6);display:none;align-items:flex-end;justify-content:center;z-index:70;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow-y:auto;animation:shIn .38s cubic-bezier(.22,1,.36,1)}
@keyframes shIn{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:19px}
.gal{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--hair)}
.gal:last-child{border:none}
/* toasts/confetti/award */
#confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.cf{position:fixed;top:-12px;border-radius:2px;pointer-events:none;z-index:60}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.toastwrap{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:65;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;animation:tIn .35s cubic-bezier(.34,1.56,.64,1)}
.toast .undo{color:var(--ac);font-weight:800;font-size:12.5px}
@keyframes tIn{from{transform:translateY(20px);opacity:0}to{opacity:1}}
#award{position:fixed;inset:0;background:rgba(8,9,10,.7);display:none;align-items:center;justify-content:center;z-index:75;backdrop-filter:blur(4px)}
#award.show{display:flex}
.award-card{background:var(--card);border:1px solid var(--ac);border-radius:24px;padding:34px 38px;text-align:center;max-width:360px;margin:20px;box-shadow:var(--shadow);animation:awIn .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes awIn{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:scale(1);opacity:1}}
.award-card .ai{font-size:48px}
.award-card h3{font-size:22px;margin-top:8px;color:var(--ac)}
/* onboarding */
#onb{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;overflow-y:auto}
#onb.show{display:block}
#auth{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;overflow-y:auto}
#auth.show{display:block}
.auth-inner{max-width:400px;margin:0 auto;padding:12vh 22px 60px}
.syncdot{width:7px;height:7px;border-radius:99px;background:var(--ink3);flex-shrink:0}
.syncdot.on{background:var(--ok)}
.syncdot.busy{background:var(--ac);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.onb-inner{max-width:560px;margin:0 auto;padding:40px 22px 60px}
.onb-logo{text-align:center;margin-bottom:26px}
.onb-logo .lm{font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:1px}
.onb-logo .lm i{font-style:normal;color:var(--ac)}
.onb-logo .lt{font-size:13px;color:var(--ink2);margin-top:4px;font-style:italic;font-family:var(--serif)}
.onb-step{display:none;animation:sIn .35s}
.onb-step.active{display:block}
.onb-step h2{font-size:22px;margin-bottom:4px}
.onb-step .sub2{font-size:13px;color:var(--ink2);margin-bottom:16px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:480px){.opt-grid{grid-template-columns:1fr}}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;transition:all .18s}
.opt .on{font-weight:700;font-size:14px}
.opt .od{font-size:11px;color:var(--ink3);margin-top:1px}
.opt.sel{border-color:var(--ac);background:var(--acg)}
.onb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;min-height:44px}
.onb-foot .btn.pri{padding:12px 26px;font-size:14px;min-height:46px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--ac)}
/* misc */
.sparkline{position:absolute;pointer-events:none;font-size:15px;animation:spark .8s ease forwards;z-index:55}
@keyframes spark{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-34px) scale(1.2);opacity:0}}
.chartbox{height:160px;position:relative;margin-top:10px}
.private-blur{filter:blur(6px);pointer-events:none;user-select:none}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.section-title h2{font-size:17px}
.section-title .rt{font-size:11px;color:var(--ink3);font-weight:700}
.empty{font-size:12.5px;color:var(--ink3);padding:10px 2px}
.suggest{border-left:3px solid var(--ac);background:var(--card2);border-radius:0 12px 12px 0;padding:11px 14px;margin-top:8px}
.suggest .st{font-weight:700;font-size:13.5px}
.suggest .sd{font-size:12px;color:var(--ink2);margin-top:2px}
</style>
</head>
<body>
<!-- AUTH GATE -->
<div id="auth"><div class="auth-inner">
 <div class="onb-logo"><div class="lm">mar<i>g</i>in</div><div class="lt">Make room for what matters.</div></div>
 <div class="card" style="margin-top:26px">
  <div class="chips" style="justify-content:center"><button class="chip sel" id="tab-in" onclick="authMode('in')">Sign in</button><button class="chip" id="tab-up" onclick="authMode('up')">Create account</button></div>
  <div style="display:grid;gap:10px;margin-top:16px">
   <input type="email" id="a-email" placeholder="you@email.com" autocomplete="email" inputmode="email">
   <input type="password" id="a-pass" placeholder="Password (8+ characters)" autocomplete="current-password">
  </div>
  <button class="btn pri" id="a-go" style="width:100%;margin-top:14px" onclick="doAuth()">Sign in</button>
  <div id="a-msg" class="muted" style="margin-top:10px;text-align:center;min-height:18px"></div>
  <div class="hr"></div>
  <button class="btn" style="width:100%" onclick="offlineMode()">Continue without an account</button>
  <div class="muted" style="margin-top:8px;text-align:center;line-height:1.5">Your data stays on this device until you sign in. Sign in later and it uploads.</div>
 </div>
 <div class="muted" style="text-align:center;margin-top:18px;font-family:var(--serif);font-style:italic">Don't optimize your life. Tend to it.</div>
</div></div>

<!-- ONBOARDING -->
<div id="onb"><div class="onb-inner">
 <div class="onb-logo"><div class="lm">mar<i>g</i>in</div><div class="lt">Make room for what matters.</div></div>
 <div id="onb-steps"></div>
 <div class="dots" id="onb-dots"></div>
</div></div>

<!-- APP -->
<div class="wrap" id="app" style="display:none">
 <div class="top">
  <button class="avatar" id="avatar" onclick="openSettings()">M</button>
  <div class="tt"><h1 id="top-title">Today</h1><div class="sub" id="top-sub"></div></div>
  <span class="syncdot" id="sync-dot" title="Offline"></span>
  <button class="iconbtn tray-btn" style="width:38px;height:38px;font-size:16px" onclick="openTray()">💡<span class="dot" id="tray-dot" style="display:none">0</span></button>

<script>
/* ================= MARGIN — core ================= */
const KEY='margin.v1', OLDKEY='trevorDash.v1';
const CAL_TOOL='mcp__c3977026-faf2-42b9-b3d6-0035ae4cae6f__list_events';
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date();
const track=()=>new Date(Date.now()-3*3600e3);
const dkey=d=>d.toLocaleDateString('en-CA');
const TK=dkey(track());
const parseK=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmtMin=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';};
const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PRIS=[['urgent','Urgent','#DE8E6F'],['high','High','#C9A45C'],['normal','Normal','#8FAE93'],['low','Low','#8A94A6']];
const priColor=p=>(PRIS.find(x=>x[0]===p)||PRIS[2])[2];

/* ---------- state ---------- */
let W=load();
function blank(){return{onboarded:false,
 profile:{name:'',photo:null,pin:'',celebration:'balanced',surface:'today',wake:'06:00',sleep:'22:00'},
 theme:{mode:'navy',accent:'terracotta'},
 categories:[],projects:[],items:[],habits:[],hlog:{},hfreeze:{},goals:[],
 journal:{},entries:[],timer:null,
 health:{modules:{},profile:{},targets:{cal:2000,p:120,c:220,f:65,water:8},log:{},meals:{},lib:[]},
 finance:{budgets:[],income:0,bills:[],goals:[],spent:{}},
 family:{members:[],dates:[],important:[]},
 autos:[],ach:{unlocked:{},custom:[]},emailSug:[],reviews:{},
 ui:{view:{},pinned:[]},clearedBoards:{}};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profile)return Object.assign(blank(),s);}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(W));}catch(e){toast('⚠️ Storage full — remove a photo.');}}
const cat=id=>W.categories.find(c=>c.id===id);
const catName=id=>(cat(id)||{}).name||'—';
const catIcon=id=>(cat(id)||{}).icon||'📁';

/* ---------- undo ---------- */
const undoStack=[];
function snap(desc){undoStack.push({desc,json:JSON.stringify(W)});if(undoStack.length>40)undoStack.shift();}
function undo(){const u=undoStack.pop();if(!u)return;W=JSON.parse(u.json);save();renderAll();toast('↩︎ Undone: '+u.desc);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400);},2400);}
function toastU(msg,desc){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span><button class="undo">Undo</button>`;t.querySelector('.undo').onclick=()=>{undo();t.remove();};document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400);},4200);}

/* ---------- celebration ---------- */
function confetti(n){const lvl=W.profile.celebration;if(lvl==='minimal')return;if(lvl==='balanced')n=Math.round(n*.5);
 const s=getComputedStyle(document.documentElement);const cols=[s.getPropertyValue('--ac').trim(),s.getPropertyValue('--ok').trim(),s.getPropertyValue('--ac2').trim(),'#EEE7D6'];
 for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';const sz=5+Math.random()*6;e.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*1.3}px;background:${cols[i%4]};animation:fall ${2.2+Math.random()*1.8}s ${Math.random()*.6}s cubic-bezier(.3,.5,.6,1) forwards;opacity:.9`;document.getElementById('confetti-layer').appendChild(e);setTimeout(()=>e.remove(),5200);}}
function sparkle(el,emoji='✨'){try{const r=el.getBoundingClientRect();const s=document.createElement('div');s.className='sparkline';s.textContent=emoji;s.style.cssText=`position:absolute;left:${r.left+r.width/2-8}px;top:${r.top+window.scrollY-4}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),850);}catch(e){}}
const awardQ=[];
function showAward(a){document.getElementById('aw-i').textContent=a.icon||'🏆';document.getElementById('aw-n').textContent=a.name;document.getElementById('aw-d').textContent=a.desc;document.getElementById('award').classList.add('show');confetti(100);}
function closeAward(){document.getElementById('award').classList.remove('show');if(awardQ.length)setTimeout(()=>showAward(awardQ.shift()),300);}

/* ---------- sheet ---------- */
function openSheetHTML(html){document.getElementById('sheet-body').innerHTML=html;document.getElementById('sheet').classList.add('show');}
function closeSheet(){document.getElementById('sheet').classList.remove('show');}
let esCb=null,esFields=[];
function openEdit(title,fields,cb,extra){esCb=cb;esFields=fields;
 openSheetHTML(`<h2>${esc(title)}</h2><div style="display:grid;gap:10px;margin-top:12px">${fields.map(f=>{
  if(f.type==='select')return`<label class="muted">${f.label}<br><select id="es-${f.key}" style="width:100%;margin-top:4px">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if(f.type==='check')return`<label class="muted" style="display:flex;align-items:center;gap:8px">${f.label}<input id="es-${f.key}" type="checkbox" ${f.value?'checked':''} style="width:18px;height:18px;accent-color:var(--ac)"></label>`;
  if(f.type==='textarea')return`<label class="muted">${f.label}<textarea id="es-${f.key}" style="margin-top:4px;min-height:70px">${esc(f.value||'')}</textarea></label>`;
  return`<label class="muted">${f.label}<br><input id="es-${f.key}" type="${f.type||'text'}" value="${esc(f.value??'')}" style="width:100%;margin-top:4px"></label>`;}).join('')}</div>
 ${extra||''}<div class="row" style="margin-top:16px"><button class="btn pri" onclick="esSave()">Save</button><button class="btn" onclick="closeSheet()">Cancel</button></div>`);}
function esSave(){if(!esCb)return;const out={};esFields.forEach(f=>{const el=document.getElementById('es-'+f.key);out[f.key]=f.type==='check'?(el&&el.checked):(el?el.value:'');});closeSheet();esCb(out);}

/* ---------- margin metric ---------- */
function hhmm(s){const[a,b]=s.split(':').map(Number);return a*60+(b||0);}
function marginToday(){const wake=hhmm(W.profile.wake||'06:00'),sleep=hhmm(W.profile.sleep||'22:00');
 let awake=sleep-wake;if(awake<=0)awake=960;
 let booked=0;
 (todayEvents||[]).forEach(e=>{if(e.start&&e.start.dateTime&&e.end&&e.end.dateTime)booked+=Math.min(240,(new Date(e.end.dateTime)-new Date(e.start.dateTime))/6e4);});
 W.items.forEach(i=>{if(!i.done&&i.sched&&i.sched.date===TK)booked+=(+i.sched.dur||30);});
 W.entries.forEach(en=>{if(dkey(new Date(en.start))===dkey(today()))booked+=(en.end-en.start)/6e4;});
 return Math.max(0,awake-booked);}
function alignToday(){const pri=W.categories.filter(c=>c.priority).map(c=>c.id);if(!pri.length)return null;
 const done=W.items.filter(i=>i.done&&i.doneAt===TK);if(!done.length)return null;
 return Math.round(done.filter(i=>pri.includes(i.catId)).length/done.length*100);}
function renderMargin(){const m=marginToday();document.getElementById('margin-v').textContent=Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0');}
function openMarginInfo(){const m=marginToday();const al=alignToday();
 openSheetHTML(`<h2>Your margin</h2><div class="muted" style="margin-top:4px">Margin is the room left in your day — awake hours minus everything booked. It's the metric no planner tracks.</div>
 <div class="row" style="margin-top:16px"><div class="stat"><div class="sv">${fmtMin(m)}</div><div class="sl">margin today</div></div>
 <div class="stat"><div class="sv">${al===null?'—':al+'%'}</div><div class="sl">alignment</div></div>
 <div class="stat"><div class="sv">${(W.reviews[TK]||{}).presence??'—'}</div><div class="sl">presence</div></div></div>
 <div class="muted" style="margin-top:12px">Alignment = share of completed work in categories you starred as priorities. Presence is how intentional today felt (logged in your evening review). Protect margin like a meeting — it's where your life happens.</div>
 <div class="muted" style="margin-top:8px;font-style:italic;font-family:var(--serif);font-size:14px;color:var(--ink2)">Don't optimize your life. Tend to it.</div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">Close</button></div>`);}

/* ---------- theming ---------- */
function applyTheme(){document.documentElement.dataset.theme=W.theme.mode;document.documentElement.dataset.accent=W.theme.accent;}

/* ---------- achievements (auto-generated from user config) ---------- */
function buildAchievements(){const A=[];
 A.push({id:'first_done',icon:'🌱',name:'Day one',desc:'Finish your first task in Margin. Everything starts here.',check:s=>W.items.some(i=>i.done)},
 {id:'first_journal',icon:'✍️',name:'On the record',desc:'Write your first journal entry.',check:s=>Object.values(W.journal).some(a=>a.length)},
 {id:'first_habit',icon:'🌿',name:'First rhythm',desc:'Tend a habit for the first time.',check:s=>Object.keys(W.hlog).length>0},
 {id:'first_plan',icon:'🗓️',name:'A planned day',desc:'Schedule anything onto your timeline.',check:s=>W.items.some(i=>i.sched)},
 {id:'first_margin',icon:'🧘',name:'Room to breathe',desc:'End a day with two or more hours of margin.',check:s=>s.marginDays>=1});
 const tiers=[[7,'a 7-day'],[30,'a 30-day'],[90,'a 90-day']];
 W.habits.forEach(h=>{tiers.forEach(([n,l])=>A.push({id:`stk_${h.id}_${n}`,icon:h.icon||'⭐',name:`${h.name}: ${n} days`,desc:`Keep ${l} streak of “${h.name}”.`,check:s=>(s.streaks[h.id]||0)>=n}));
  [[25,'25'],[100,'100'],[365,'365']].forEach(([n])=>A.push({id:`tot_${h.id}_${n}`,icon:h.icon||'⭐',name:`${h.name} ×${n}`,desc:`Complete “${h.name}” ${n} times, lifetime.`,check:s=>(s.totals[h.id]||0)>=n}));});
 W.goals.forEach(g=>A.push({id:`goal_${g.id}`,icon:'🎯',name:`Goal: ${g.name}`,desc:'Reach 100% on this goal.',check:s=>goalPct(g)>=100}));
 [[1,'First project shipped'],[5,'Five projects shipped'],[15,'Fifteen shipped']].forEach(([n,name])=>A.push({id:`proj_${n}`,icon:'📦',name,desc:`Complete ${n} project${n>1?'s':''}.`,check:s=>s.projDone>=n}));
 [[1,'Planned & done'],[7,'A planned week'],[30,'A planned month']].forEach(([n,name])=>A.push({id:`pd_${n}`,icon:'✨',name,desc:`Finish every planned task on ${n} day${n>1?'s':''}.`,check:s=>s.clearDays>=n}));
 [[1,'First hour tracked'],[25,'25 focused hours'],[100,'100 focused hours']].forEach(([n,name])=>A.push({id:`fh_${n}`,icon:'⏱️',name,desc:`Track ${n} hour${n>1?'s':''} of focused time.`,check:s=>s.focusHours>=n}));
 [[1,'First review'],[4,'A month of reviews'],[12,'Review ritualist']].forEach(([n,name])=>A.push({id:`rev_${n}`,icon:'🪞',name,desc:`Complete ${n} weekly review${n>1?'s':''}.`,check:s=>s.weeklyReviews>=n}));
 [[3,'Margin kept ×3'],[14,'Margin kept ×14']].forEach(([n,name])=>A.push({id:`mar_${n}`,icon:'🌿',name,desc:`End ${n} days with 2+ hours of margin.`,check:s=>s.marginDays>=n}));
 [[7,'A week written'],[30,'A month written']].forEach(([n,name])=>A.push({id:`jr_${n}`,icon:'📓',name,desc:`Journal ${n} days in a row.`,check:s=>s.journalStreak>=n}));
 W.ach.custom.forEach(c=>A.push({id:c.id,icon:c.icon||'🏅',name:c.name,desc:c.desc,check:s=>c.done}));
 return A;}
function habitDoneOn(k,h){const v=(W.hlog[k]||{})[h.id];if(h.qty&&h.qty.target)return(+v||0)>=h.qty.target;return!!v;}
function computeStats(){const s={streaks:{},totals:{},projDone:W.projects.filter(p=>p.status==='done').length,clearDays:Object.keys(W.clearedBoards).length,
 focusHours:W.entries.reduce((a,e)=>a+(e.end-e.start),0)/36e5,weeklyReviews:Object.keys(W.reviews).filter(k=>W.reviews[k].weekly).length,
 marginDays:Object.keys(W.reviews).filter(k=>W.reviews[k].marginKept).length,journalStreak:0};
 W.habits.forEach(h=>{if(h.paused){s.streaks[h.id]=h.frozenStreak||0;s.totals[h.id]=Object.keys(W.hlog).filter(k=>habitDoneOn(k,h)).length;return;}
  let n=0,c=track(),freezes=0;if(!habitDoneOn(dkey(c),h))c=addDays(c,-1);
  while(true){if(habitDoneOn(dkey(c),h)){n++;c=addDays(c,-1);}
   else if(h.freeze!==false&&freezes<2&&(W.hfreeze[dkey(c)+'_'+h.id])){n++;freezes++;c=addDays(c,-1);}
   else break;}
  s.streaks[h.id]=n;s.totals[h.id]=Object.keys(W.hlog).filter(k=>habitDoneOn(k,h)).length;});
 let c=track(),j=0;const hasJ=k=>(W.journal[k]||[]).some(e=>(e.text||'').trim());if(!hasJ(dkey(c)))c=addDays(c,-1);while(hasJ(dkey(c))){j++;c=addDays(c,-1);}s.journalStreak=j;
 return s;}
function goalPct(g){if(g.type==='numeric')return Math.min(100,Math.round(((+g.current||0)/(+g.target||1))*100));
 if(g.type==='milestone'){const ms=g.milestones||[];return ms.length?Math.round(ms.filter(m=>m.done).length/ms.length*100):0;}
 if(g.type==='tasks'){const ls=W.items.filter(i=>(g.links.tasks||[]).includes(i.id));return ls.length?Math.round(ls.filter(i=>i.done).length/ls.length*100):0;}
 if(g.type==='habit'){const h=W.habits.find(h=>h.id===g.links.habit);if(!h)return 0;return Math.min(100,Math.round((computeStats().streaks[h.id]||0)/(+g.target||30)*100));}
 return Math.min(100,+g.current||0);}
function checkAchievements(){const s=computeStats();let first=null;
 buildAchievements().forEach(a=>{if(!W.ach.unlocked[a.id]){let ok=false;try{ok=a.check(s);}catch(e){}
  if(ok){W.ach.unlocked[a.id]=TK;if(W.profile.celebration!=='minimal'){if(!first)first=a;else awardQ.push(a);}else toast('🏅 '+a.name);}}});
 save();if(first)showAward(first);return s;}
/* ================= ONBOARDING ================= */
const CAT_TEMPLATES=[['💼','Work'],['🚀','Side Business'],['👨‍👩‍👧‍👦','Family'],['❤️','Health'],['💪','Fitness'],['🍎','Nutrition'],['🕊️','Spirituality'],['💰','Finance'],['📓','Journal'],['🎓','Education'],['🏠','Home'],['✈️','Travel'],['🤝','Social'],['🎨','Creative'],['🌱','Personal Growth'],['🧠','Mental Health'],['💞','Relationship']];
const MODULES=[['habits','Habit & streak tracking'],['goals','Goals & milestones'],['time','Time tracking'],['nutrition','Nutrition & meals'],['healthlog','Health check-ins'],['finance','Finance & budgets'],['journal','Journaling'],['family','Family & relationships'],['ach','Achievements']];
let onbStep=0,onbSel={cats:['Work','Family','Health'],mods:['habits','goals','time','journal','ach'],surface:'today',theme:'navy',accent:'terracotta',name:''};
const ONB_STEPS=[
 {t:'Welcome to Margin',s:'One calm place for everything you carry. First — what should we call you?',body:()=>`<input type="text" id="onb-name" placeholder="Your first name" style="width:100%;font-size:16px;padding:12px" value="${esc(onbSel.name)}">
  <div class="muted" style="margin-top:14px">Margin isn't another productivity app. It helps your calendar reflect your values — and measures the room left for living.</div>`,
  save:()=>{onbSel.name=document.getElementById('onb-name').value.trim()||'Friend';}},
 {t:'Which areas of life do you want to organize?',s:'These become your categories. Rename, add, or remove any of them later — nothing here is permanent.',body:()=>`<div class="opt-grid">${CAT_TEMPLATES.map(([i,n])=>`<button class="opt ${onbSel.cats.includes(n)?'sel':''}" onclick="onbToggle('cats','${n}',this)"><div class="on">${i} ${n}</div></button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input type="text" id="onb-custom" placeholder="Add your own…" style="flex:1"><button class="btn soft" onclick="onbAddCat()">Add</button></div>`},
 {t:'Which tools do you want turned on?',s:'Everything is optional. Turn any of these on or off anytime in Settings.',body:()=>`<div class="opt-grid">${MODULES.map(([k,n])=>`<button class="opt ${onbSel.mods.includes(k)?'sel':''}" onclick="onbToggle('mods','${k}',this)"><div class="on">${n}</div></button>`).join('')}</div>`},
 {t:'How should Margin open each day?',s:'Both are always one tap away — this sets your home.',body:()=>`<div class="opt-grid">
  <button class="opt ${onbSel.surface==='today'?'sel':''}" onclick="onbSet('surface','today',this)"><div class="on">🕐 Today view</div><div class="od">Your day hour-by-hour, tasks slotted in. Planning-first.</div></button>
  <button class="opt ${onbSel.surface==='dash'?'sel':''}" onclick="onbSet('surface','dash',this)"><div class="on">▦ Dashboard</div><div class="od">Widgets and summaries first; schedule below.</div></button></div>`},
 {t:'Pick your look',s:'Themes and accents are all changeable later.',body:()=>`<div class="opt-grid">
  <button class="opt ${onbSel.theme==='navy'?'sel':''}" onclick="onbSet('theme','navy',this);W.theme.mode='navy';applyTheme()"><div class="on">🌊 Navy</div><div class="od">Deep blue, warm accents</div></button>
  <button class="opt ${onbSel.theme==='dark'?'sel':''}" onclick="onbSet('theme','dark',this);W.theme.mode='dark';applyTheme()"><div class="on">🌙 Dark</div><div class="od">Calm, low-light</div></button>
  <button class="opt ${onbSel.theme==='light'?'sel':''}" onclick="onbSet('theme','light',this);W.theme.mode='light';applyTheme()"><div class="on">☀️ Light</div><div class="od">Warm paper & ink</div></button></div>
  <div class="chips" style="margin-top:12px">${['terracotta','champagne','sage','ocean','rose','slate'].map(a=>`<button class="chip ${onbSel.accent===a?'sel':''}" onclick="onbSet('accent',a,this);W.theme.accent=a;applyTheme()">${a}</button>`).join('')}</div>`},
 {t:'Ready.',s:'Your workspace will be built from these choices. You can reshape every part of it.',body:()=>`<div class="card" style="text-align:center;padding:24px">
  <div style="font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink2)">“Productivity fills your calendar.<br>Intention fills your life.”</div></div>
  ${localStorage.getItem(OLDKEY)?`<div class="suggest" style="margin-top:12px"><div class="st">Found data from your previous HQ dashboard</div><div class="sd">Download a backup before starting fresh — nothing gets lost.</div><div class="row" style="margin-top:8px"><button class="btn soft sm" onclick="backupOld()">⬇️ Download old backup</button></div></div>`:''}
  <div class="suggest" style="margin-top:12px"><div class="st">Load the demo workspace?</div><div class="sd">Pre-fills a realistic filmmaker-parent workspace (categories, habits, pipeline, family) so you can feel Margin working on day one. Skip for a blank start.</div>
  <div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="finishOnb(true)">Load it</button><button class="btn sm" onclick="finishOnb(false)">Start blank</button></div></div>`}];
function onbToggle(field,v){const a=onbSel[field];const i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v);renderOnb();}
function onbSet(f,v){onbSel[f]=v;renderOnb();}
function onbAddCat(){const v=document.getElementById('onb-custom').value.trim();if(!v)return;if(!CAT_TEMPLATES.find(c=>c[1]===v))CAT_TEMPLATES.push(['📁',v]);if(!onbSel.cats.includes(v))onbSel.cats.push(v);renderOnb();}
function renderOnb(){const st=ONB_STEPS[onbStep];
 document.getElementById('onb-steps').innerHTML=`<div class="onb-step active"><h2>${st.t}</h2><div class="sub2">${st.s}</div>${st.body()}
 <div class="onb-foot">${onbStep>0?`<button class="btn" onclick="onbPrev()">← Back</button>`:'<span></span>'}
 ${onbStep<ONB_STEPS.length-1?`<button class="btn pri" onclick="onbNext()">Continue →</button>`:''}</div></div>`;
 document.getElementById('onb-dots').innerHTML=ONB_STEPS.map((_,i)=>`<i class="${i===onbStep?'on':''}"></i>`).join('');}
function onbNext(){const st=ONB_STEPS[onbStep];if(st.save)st.save();onbStep++;renderOnb();}
function onbPrev(){onbStep--;renderOnb();}
function backupOld(){try{const blob=localStorage.getItem(OLDKEY)||'{}';const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(blob);a.download='hq-backup.json';document.body.appendChild(a);a.click();a.remove();try{navigator.clipboard.writeText(blob);}catch(e){}toast('Backup saved. Your history is safe.');}catch(e){toast('Could not read old data.');}}
function finishOnb(seed){W=blank();W.onboarded=true;W.profile.name=onbSel.name||'Friend';W.profile.surface=onbSel.surface==='dash'?'dash':'today';
 W.theme={mode:onbSel.theme,accent:onbSel.accent};

 openSheetHTML(`<h2>Weekly review</h2>
 <div class="row" style="margin-top:12px"><div class="stat"><div class="sv">${doneN}</div><div class="sl">tasks done</div></div>
 <div class="stat"><div class="sv">${focus.toFixed(1)}h</div><div class="sl">focused</div></div>
 <div class="stat"><div class="sv">🔥 ${Math.max(0,...Object.values(s.streaks),0)}</div><div class="sl">best streak</div></div></div>

let calMode='week';
function renderCal(){const host=document.getElementById('scr-cal');if(!host)return;
 const mon=addDays(today(),-((today().getDay()+6)%7));
 let days='';for(let i=0;i<7;i++){const d=addDays(mon,i);const k=dkey(d);
  const evs=(weekEvents||[]).filter(e=>{const sd=evDate(e);return sd&&dkey(sd)===k;}).slice(0,3);
  const tks=W.items.filter(t=>!t.archived&&(t.due===k||t.dl===k||(t.sched&&t.sched.date===k))).slice(0,3);
  days+=`<div class="cal-day ${k===dkey(today())?'today':''}"><div class="dn">${d.getDate()}<span class="muted" style="font-size:9px"> ${DOWS[d.getDay()]}</span></div>
  ${evs.map(e=>`<div class="ev">${esc((e.summary||'').slice(0,18))}</div>`).join('')}
  ${tks.map(t=>`<div class="tk" ${t.dl===k?'style="background:var(--warng);color:var(--warn)"':''}>${t.dl===k?'⏰ ':''}${esc(t.title.slice(0,18))}</div>`).join('')}</div>`;}
 const un=W.items.filter(i=>!i.done&&!i.archived&&!i.sched&&!i.due&&!i.dl);
 const wkLoad=W.items.filter(i=>!i.done&&!i.archived&&i.sched&&i.sched.date>=dkey(mon)&&i.sched.date<=dkey(addDays(mon,6))).reduce((a,i)=>a+(+i.sched.dur||30),0);
 host.innerHTML=`<div class="card"><div class="spread"><h2 style="font-size:17px">This week</h2><span class="muted">${fmtMin(wkLoad)} scheduled · deadlines in ⏰ red</span></div>
 <div class="cal-week" style="margin-top:10px">${days}</div></div>
 <div class="card"><div class="spread"><h2 style="font-size:16px">Deadlines ahead</h2></div>
 <div style="margin-top:4px">${W.items.filter(i=>!i.done&&!i.archived&&i.dl).sort((a,b)=>a.dl<b.dl?-1:1).slice(0,8).map(i=>{const d=Math.ceil((parseK(i.dl)-today())/864e5);
 return`<div class="item"><span class="pdot" style="background:${d<0?'var(--warn)':priColor(i.pri)}"></span><div class="it" onclick="openItem('${i.id}')"><div class="t">${esc(i.title)}</div><div class="m">${catName(i.catId)} · ${i.dl}</div></div><span class="badge ${d<0?'warn':d<=7?'warn':'ac'}">${d<0?-d+'d over':d+'d'}</span></div>`;}).join('')||'<div class="empty">No hard deadlines. Breathe.</div>'}</div></div>
 ${un.length?`<div class="card"><h2 style="font-size:16px">Unscheduled (${un.length})</h2><div class="muted">No date, no home — schedule or let go.</div>
 <div style="margin-top:4px">${un.slice(0,8).map(itemRow).join('')}</div></div>`:''}`;}

 const inR=(k0,k1)=>W.entries.filter(e=>{const k=dkey(new Date(e.start));return k>=k0&&k<=k1;});
 const sum=es=>es.reduce((a,e)=>a+(e.end-e.start)/6e4,0);

 host.innerHTML=`

 <button class="btn soft sm" style="margin-top:10px" onclick="snap('profile');W.profile.name=document.getElementById('st-name').value;W.profile.wake=document.getElementById('st-wake').value;W.profile.sleep=document.getElementById('st-sleep').value;save();renderAll();toastU('Saved','profile')">Save profile</button></div>
 <div class="card"><h2 style="font-size:15px">Appearance</h2>
 <div class="row" style="margin-top:8px">${[['dark','🌙 Dark'],['navy','🌊 Navy'],['light','☀️ Light']].map(([v,l])=>`<button class="chip ${W.theme.mode===v?'sel':''}" onclick="W.theme.mode='${v}';save();applyTheme();openSettings()">${l}</button>`).join('')}</div>
 <div class="chips" style="margin-top:8px">${['terracotta','champagne','sage','ocean','rose','slate'].map(a=>`<button class="chip ${W.theme.accent===a?'sel':''}" onclick="W.theme.accent='${a}';save();applyTheme();openSettings()">${a}</button>`).join('')}</div>
 <div class="muted" style="margin-top:8px">Navy + terracotta is the signature pairing — deep, calm, warm.</div></div>
 <div class="card"><h2 style="font-size:15px">Account & sync</h2>
 ${USER?`<div class="row" style="margin-top:8px"><span class="syncdot on"></span><div style="flex:1;font-size:13.5px">Signed in as <b>${esc(USER.email||'')}</b><div class="muted">Everything saves to your private cloud workspace.</div></div></div>
 <div class="row" style="margin-top:10px"><button class="btn sm soft" onclick="pushCloud().then(()=>toast('Synced.'))">Sync now</button><button class="btn sm" onclick="signOut()">Sign out</button></div>`
 :`<div class="muted" style="margin-top:6px">Working offline — data lives only on this device.</div>
 <button class="btn pri sm" style="margin-top:10px" onclick="localStorage.removeItem('margin.offline');location.reload()">Sign in to sync</button>`}</div>
 <div class="card"><h2 style="font-size:15px">Privacy</h2>
 <div class="row" style="margin-top:8px"><label class="muted">PIN for private categories<br><input type="password" id="st-pin" maxlength="4" inputmode="numeric" value="${esc(W.profile.pin)}" style="margin-top:3px;width:100px;letter-spacing:5px"></label>
 <button class="btn soft sm" onclick="snap('pin');W.profile.pin=document.getElementById('st-pin').value;pinOK=false;save();toastU('PIN set','pin')">Set</button></div>
 <div class="muted" style="margin-top:6px">Private categories blur on dashboards and require the PIN to open. All data lives on this device only.</div></div>
 <div class="card"><h2 style="font-size:15px">Connections <span class="badge ac">framework</span></h2>
 ${[['📅','Calendar (Google)',window.cowork?'live':'staged'],['📬','Email (Gmail / Outlook)','staged'],['❤️','Apple Health / Watch','staged'],['🍎','Food database + barcode','staged'],['🏦','Banks (Plaid)','staged'],['💬','Slack / Teams','staged'],['☁️','Sync + accounts (Supabase)','staged']].map(([i,n,st])=>`<div class="gal"><span>${i}</span><div style="flex:1;font-size:13.5px;font-weight:600">${n}</div><span class="badge ${st==='live'?'ok':'ac'}">${st==='live'?'● live':'staged'}</span></div>`).join('')}
 <div class="muted" style="margin-top:6px">Every staged row is a plug-in slot in the data model — connected per-category, always with permission.</div></div>
 <div class="card"><h2 style="font-size:15px">Data</h2>
 <div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="exportData()">⬇️ Export backup</button>
 <button class="btn sm" onclick="document.getElementById('imp').click()">⬆️ Import</button><input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)">
 ${localStorage.getItem(OLDKEY)?`<button class="btn sm" onclick="backupOld()">Old HQ backup</button>`:''}
 <button class="btn danger sm" onclick="if(this.dataset.arm){localStorage.removeItem(KEY);location.reload();}else{this.dataset.arm=1;this.textContent='Tap again to erase';}">Reset all</button></div></div>`);}
function exportData(){const blob=JSON.stringify(W,null,1);try{navigator.clipboard.writeText(blob);}catch(e){}
 try{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(blob);a.download='margin-backup-'+TK+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}toast('Backup exported.');}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=e=>{try{snap('import');const p=JSON.parse(e.target.result);if(!p.profile)throw 0;localStorage.setItem(KEY,JSON.stringify(p));W=load();applyTheme();renderAll();toastU('Restored','import');}catch(x){toast('Not a valid Margin backup.');}};rd.readAsText(f);}

/* ---- suggestion tray ---- */
function buildSuggestions(){const out=[];const od=overdueItems();
 if(od.length)out.push({t:`${od.length} overdue — roll them into today?`,d:od.slice(0,2).map(i=>i.title).join(' · '),act:'rollOverdue()',ok:'Roll them'});
 const un=W.items.filter(i=>!i.done&&!i.archived&&!i.sched&&(i.dl||i.due));
 if(un.length&&!W.items.some(i=>i.sched&&i.sched.date===TK))out.push({t:'Nothing planned yet today',d:'Auto-plan around your calendar?',act:'autoPlan()',ok:'✨ Plan it'});
 const nd=nearestDeadline();if(nd){const d=Math.ceil((parseK(nd.dl)-today())/864e5);if(d<=7&&d>=0)out.push({t:`“${nd.title}” lands in ${d} day${d===1?'':'s'}`,d:'Want a focus block for it?',act:`placeItem('${nd.id}',${Math.max(today().getHours()+1,9)})`,ok:'Block time'});}
 if(marginToday()<60)out.push({t:'Today is nearly margin-less',d:'Consider moving one non-urgent thing. Full is not the goal.',act:'',ok:''});
 if(W.emailSug.length)out.push({t:`${W.emailSug.length} email suggestion${W.emailSug.length>1?'s':''} waiting`,d:'Deadlines & bills detected in mail.',act:"openMod('email')",ok:'Review'});
 return out;}
function openTray(){const s=buildSuggestions();
 openSheetHTML(`<h2>💡 Suggestions</h2><div class="muted">Margin suggests. You decide. Always.</div>
 ${s.map(x=>`<div class="suggest"><div class="st">${esc(x.t)}</div><div class="sd">${esc(x.d)}</div>
 ${x.ok?`<div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="closeSheet();${x.act}">${x.ok}</button></div>`:''}</div>`).join('')||'<div class="empty" style="margin-top:10px">Nothing to suggest. You\'re ahead of it. 🌿</div>'}
 <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">Close</button></div>`);}
function trayDot(){const n=buildSuggestions().length;const d=document.getElementById('tray-dot');d.style.display=n?'flex':'none';d.textContent=n;}

/* ================= SUPABASE SYNC ================= */
const SUPA_URL='https://bplduvooflkpopxycchd.supabase.co';
const SUPA_KEY='sb_publishable_PLJaVj5JzwI6qjy6a3z8xw_AlpQGyOw';
let sb=null,USER=null,syncTimer=null,syncing=false;
try{if(window.supabase)sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);}catch(e){}

function authMode(m){document.getElementById('tab-in').classList.toggle('sel',m==='in');
 document.getElementById('tab-up').classList.toggle('sel',m!=='in');
 document.getElementById('a-go').textContent=m==='in'?'Sign in':'Create account';
 document.getElementById('a-go').dataset.mode=m;document.getElementById('a-msg').textContent='';}
function authMsg(t,bad){const e=document.getElementById('a-msg');e.textContent=t;e.style.color=bad?'var(--warn)':'var(--ink3)';}
async function doAuth(){if(!sb){authMsg('Cannot reach the server. Use "Continue without an account".',1);return;}
 const email=document.getElementById('a-email').value.trim(),pass=document.getElementById('a-pass').value;
 const mode=document.getElementById('a-go').dataset.mode||'in';
 if(!email||pass.length<8){authMsg('Enter an email and a password of at least 8 characters.',1);return;}
 authMsg('Working…');
 try{
  let r=mode==='in'?await sb.auth.signInWithPassword({email,password:pass})
                   :await sb.auth.signUp({email,password:pass});
  if(r.error){authMsg(r.error.message,1);return;}
  if(mode==='up'&&!r.data.session){authMsg('Check your email to confirm, then sign in.');return;}
  USER=r.data.user;await afterAuth();
 }catch(e){authMsg('Network problem — try again, or continue offline.',1);}}
function offlineMode(){USER=null;localStorage.setItem('margin.offline','1');startApp();}
async function afterAuth(){localStorage.removeItem('margin.offline');
 authMsg('Loading your workspace…');
 const remote=await pullCloud();
 if(remote&&remote.onboarded){W=Object.assign(blank(),remote);save();}
 else if(W.onboarded){await pushCloud();}
 startApp();}
async function pullCloud(){if(!sb||!USER)return null;
 try{const{data,error}=await sb.from('profiles').select('settings,onboarded,name').eq('id',USER.id).maybeSingle();
  if(error||!data)return null;
  const s=data.settings&&data.settings.snapshot?data.settings.snapshot:null;
  return s;}catch(e){return null;}}
async function pushCloud(){if(!sb||!USER||syncing)return;syncing=true;setSync('busy');
 try{await sb.from('profiles').upsert({id:USER.id,name:W.profile.name||'',onboarded:!!W.onboarded,
   theme_mode:W.theme.mode,theme_accent:W.theme.accent,surface:W.profile.surface,
   celebration:W.profile.celebration,settings:{snapshot:W,v:1,at:new Date().toISOString()},
   updated_at:new Date().toISOString()});
  setSync('on');}catch(e){setSync('');}
 syncing=false;}
function queueSync(){if(!USER)return;clearTimeout(syncTimer);setSync('busy');syncTimer=setTimeout(pushCloud,2500);}
function setSync(state){const d=document.getElementById('sync-dot');if(!d)return;
 d.className='syncdot '+(state||'');d.title=state==='on'?'Synced':state==='busy'?'Syncing…':'Offline';}
async function signOut(){if(sb)await sb.auth.signOut();USER=null;localStorage.removeItem('margin.offline');location.reload();}

/* wrap save() so every mutation schedules a cloud push */
const _save=save;
save=function(){_save();queueSync();};

/* ================= BOOT ================= */
function renderAll(){applyTheme();buildNav();
 const av=document.getElementById('avatar');av.textContent=(W.profile.name||'M')[0].toUpperCase();
 const R={today:renderToday,cal:renderCal,browse:renderBrowse,time:renderTime,more:renderMore};if(R[CUR])R[CUR]();
 renderMargin();trayDot();runAutos(false);setSync(USER?'on':'');}
function startApp(){document.getElementById('auth').classList.remove('show');
 if(!W.onboarded){document.getElementById('onb').classList.add('show');renderOnb();}
 else{document.getElementById('onb').classList.remove('show');
  document.getElementById('app').style.display='';document.getElementById('nav').style.display='flex';renderAll();}
 if(window.cowork)loadCal();else{todayEvents=[];weekEvents=[];}
 checkAchievements();}
(async function boot(){applyTheme();
 if(sb){try{const{data}=await sb.auth.getSession();
   if(data&&data.session){USER=data.session.user;await afterAuth();return;}}catch(e){}}
 if(localStorage.getItem('margin.offline')||!sb){startApp();return;}
 document.getElementById('auth').classList.add('show');authMode('in');})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
